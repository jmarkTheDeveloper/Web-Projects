<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Management Systems</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Hello Welcome To Your Barangay Management System</h1>
    <form class="citizen-form">
        <h2>Register New Citizen</h2>
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="Enter First Name">

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placehold="Enter Last Name">

        <label for="civilStatus">Civil Status</label>
        <select id="civilStatus">
            <option value="Single">Single</option>
            <option value="married">Married</option>
            <option value="widowed">Widowed</option>
        </select>
        <button type="submit">Register Citizen</button>
    </form>
</body>

</html>
